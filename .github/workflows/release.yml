name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libncursesw5-dev pkg-config
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: Build and test
        run: cmake --build build --parallel && ctest --test-dir build --output-on-failure
      - name: Stage archive
        run: DESTDIR="$PWD/stage" cmake --install build
      - name: Create archive
        run: tar -C stage/usr -czf "zari-linux-${{ matrix.arch }}.tar.gz" bin/zari share/zari
      - name: Build Debian package
        run: cd build && cpack -G DEB
      - name: Collect artifacts
        run: |
          mkdir dist
          mv "zari-linux-${{ matrix.arch }}.tar.gz" dist/
          find build -maxdepth 1 -name '*.deb' -exec mv {} dist/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: zari-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zari-linux-*
          path: dist
          merge-multiple: true
      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
